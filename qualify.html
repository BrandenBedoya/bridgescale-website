<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Four quick questions to see if BridgeScale Advisors is a fit for your contracting business.">
<title>Do You Qualify? — BridgeScale Advisors</title>
<style>
:root{--navy:#0f1e35;--gold:#c9a84c;--bg:#F7F6F2;--ink:#1a1a1a;--muted:#5a6273;--line:#e2ddd2}
html{color-scheme:light only}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.bsq-bar-wrap,.bsi-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bsi-bar-wrap{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.bsq-bar-track,.bsi-bar-track{flex:1;height:8px;background:#e9e5da;border-radius:99px;overflow:hidden}
.bsq-bar-fill,.bsi-bar-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .3s ease;width:0}
.bsq-bar-label,.bsi-bar-label{font-size:12px;font-weight:bold;color:var(--navy);min-width:96px;text-align:right}
.bs-wrap{max-width:720px;margin:0 auto;padding:32px 20px 64px}
.bs-brand{color:var(--navy);font-weight:bold;letter-spacing:.04em;font-size:14px;text-transform:uppercase}
.bs-tag{color:var(--gold);font-size:12px;margin-bottom:24px}
/* qualifier */
.bsq-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 2px 10px rgba(27,42,74,.06)}
.bsq-progress{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.bsq-title{margin:0 0 4px;color:var(--navy);font-size:22px}
.bsq-subtitle{margin:0 0 16px;color:var(--muted);font-size:14px}
.bsq-question{font-size:17px;font-weight:bold;color:var(--navy);margin:12px 0 16px}
.bsq-options{display:grid;gap:10px}
.bsq-option{display:block;width:100%;text-align:left;padding:14px 16px;font-size:15px;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s;font-family:inherit}
.bsq-option:hover{border-color:var(--gold);background:#fdfaf2}
.bsq-selected{border-color:var(--navy);background:#f0f3fa}
.bsq-back{margin-top:16px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;font-family:inherit}
.bsq-result-heading{color:var(--navy);font-size:22px;margin:0 0 8px}
.bsq-result-body{color:var(--ink);font-size:15px;line-height:1.55}
.bsq-cta{display:inline-block;margin-top:12px;background:var(--gold);color:#fff;padding:13px 26px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:15px}
.bsq-cta:hover{background:#a58527}
.bsq-alt-link{display:block;margin-top:12px;color:var(--navy);font-size:13px}
.bsq-disclaimer{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.5}
/* intake */
.bsi-title{color:var(--navy);font-size:26px;margin:0 0 6px}
.bsi-subtitle{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 24px}
.bsi-form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 2px 10px rgba(27,42,74,.06)}
.bsi-section{border:none;border-top:2px solid var(--line);margin:0 0 8px;padding:18px 0 6px}
.bsi-section:first-child{border-top:none;padding-top:0}
.bsi-legend{color:var(--gold);font-weight:bold;font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding:0 0 6px}
.bsi-intro{font-size:13px;color:var(--muted);margin:0 0 10px}
.bsi-field{margin-bottom:16px}
.bsi-label{display:block;font-size:14px;font-weight:bold;color:var(--navy);margin-bottom:6px}
.bsi-input{width:100%;padding:11px 12px;font-size:15px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;background:#fff;color:var(--ink)}
.bsi-input:focus{outline:none;border-color:var(--gold)}
.bsi-group{display:grid;gap:6px}
.bsi-choice{font-size:14px;display:flex;align-items:flex-start;gap:8px;line-height:1.45;font-weight:normal;color:var(--ink)}
.bsi-choice input{margin-top:2px;accent-color:#0f1e35}
.bsi-missing{background:#fdf3f3;border-left:3px solid #c0392b;padding-left:10px;border-radius:4px}
.bsi-status{font-size:13px;color:var(--muted);min-height:18px}
.bsi-error{color:#c0392b;font-weight:bold}
.bsi-submit{background:var(--gold);color:#fff;border:none;padding:14px 30px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
.bsi-submit:hover{background:#a58527}
.bsi-mailto{display:block;margin-top:12px;font-size:12px;color:var(--muted)}
.bsi-sent{color:var(--navy);font-size:17px;font-weight:bold}
.bsi-disclaimer{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.5}
/* checklist */
.bsc-title{color:var(--navy);font-size:24px;margin:0 0 8px}
.bsc-subtitle{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}
.bsc-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(27,42,74,.06)}
.bsc-section-title{color:var(--gold);font-weight:bold;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px}
.bsc-section-title:first-child{margin-top:0}
.bsc-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:#fff}
.bsc-item:hover{border-color:var(--gold)}
.bsc-item input{margin-top:3px;accent-color:#0f1e35;flex-shrink:0}
.bsc-item-main{font-size:14px;color:var(--ink);font-weight:bold}
.bsc-item-cost{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.bsc-result{margin-top:18px;padding:16px;background:var(--bg);border-radius:8px}
.bsc-tier{font-size:18px;font-weight:bold;color:var(--navy)}
.bsc-tier-body{font-size:14px;color:var(--ink);line-height:1.5;margin:6px 0 4px}
.bsc-capture{margin-top:20px;background:var(--navy);border-radius:12px;padding:24px;color:#fff}
.bsc-capture-heading{color:#fff;font-size:20px;margin:0 0 6px}
.bsc-capture-body{color:#cfd5e2;font-size:13px;line-height:1.5;margin:0 0 14px}
.bsc-capture .bsi-input{margin-bottom:10px}
.bsc-consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#cfd5e2;line-height:1.45;margin-bottom:10px}
.bsc-consent input{margin-top:2px;accent-color:#c9a84c}
.bsc-capture .bsi-status{color:#cfd5e2}
.bsc-capture .bsi-error{color:#ffb3b3}
.bsc-capture .bsi-sent{color:#fff}
@media(max-width:480px){.bsq-card,.bsi-form,.bsc-card,.bsc-capture{padding:18px}}
</style>
</head>
<body>
<div class="bs-wrap">
  <a href="index.html" style="text-decoration:none"><div class="bs-brand">BridgeScale Advisors</div></a>
  <div class="bs-tag">Bid Bigger. Bond Faster. Build Without Limits.</div>
  <div id="bs-qualify"></div>
</div>
<script>
"use strict";
/**
 * BridgeScale Advisors — 4-Question Contractor Qualifier
 * Renders into <div id="bs-qualify"></div>. No dependencies, no backend required.
 * All user-facing copy lives in STRINGS so Branden can produce the ES version
 * (manual localization — do not machine-translate).
 */
const STRINGS = {
    title: "Is BridgeScale a fit for your business?",
    subtitle: "Four quick questions. No email required. Takes 30 seconds.",
    next: "Next",
    back: "Back",
    seeResult: "See my result",
    qualifiedHeading: "You look like a strong fit.",
    qualifiedBody: "Based on your answers, a free 30-minute Contractor Readiness Assessment is the right next step. I'll map which of the five doors — credit, business credit, capital, bonding, contract readiness — is blocking you.",
    qualifiedCta: "Book My Free Assessment",
    notYetHeading: "Let's build your foundation first.",
    notYetBody: "You may not need a full advisory engagement yet — and I won't sell you one. Start with the free 14-point Credit Readiness Checklist: it shows exactly which gaps are blocking you and the order to close them. Or book a call anyway and I'll point you in the right direction at no cost.",
    notYetCta: "Get the Free Readiness Checklist",
    disclaimer: "This tool provides a preliminary indication only. No specific credit, funding, bonding, or contract outcome is guaranteed.",
    stepOf: (c, t) => `Question ${c} of ${t}`,
    pctComplete: (pct) => `${pct}% completed`,
};
const QUESTIONS = [
    {
        id: "revenue",
        text: "What is your business's approximate annual revenue?",
        options: [
            { label: "Under $500K", points: 1 },
            { label: "$500K – $2M", points: 3 },
            { label: "$2M – $25M", points: 3 },
            { label: "Not in business yet", points: 0 },
        ],
    },
    {
        id: "blocker",
        text: "What's the biggest thing holding your business back right now?",
        options: [
            { label: "Bonding capacity caps what I can bid", points: 3 },
            { label: "Declined for funding or a credit line", points: 3 },
            { label: "Personal or business credit issues", points: 2 },
            { label: "I want government contracts but don't know where to start", points: 2 },
        ],
    },
    {
        id: "timeline",
        text: "When do you need to be ready to bid or borrow?",
        options: [
            { label: "I'm actively bidding / applying now", points: 3 },
            { label: "Within the next 90 days", points: 3 },
            { label: "Within 6–12 months", points: 2 },
            { label: "Just exploring", points: 1 },
        ],
    },
    {
        id: "experience",
        text: "How long have you been operating in your trade?",
        options: [
            { label: "3+ years", points: 3 },
            { label: "1–3 years", points: 2 },
            { label: "Under 1 year", points: 1 },
            { label: "Not a contractor (other business)", points: 1 },
        ],
    },
];
/** Score at or above this → qualified path. Max score = 12. */
const QUALIFY_THRESHOLD = 8;
const BOOKING_URL = "contact.html";
const STAGE1_URL = "checklist.html";
class QualifyWidget {
    constructor(rootId) {
        this.step = 0;
        this.answers = [];
        this.selected = [];
        const el = document.getElementById(rootId);
        if (!el)
            throw new Error(`#${rootId} not found`);
        this.root = el;
        this.render();
    }
    score() {
        return this.answers.reduce((a, b) => a + b, 0);
    }
    render() {
        this.root.innerHTML = "";
        const card = div("bsq-card");
        card.appendChild(this.progressBar());
        if (this.step < QUESTIONS.length) {
            const q = QUESTIONS[this.step];
            card.appendChild(el("div", "bsq-progress", STRINGS.stepOf(this.step + 1, QUESTIONS.length)));
            if (this.step === 0) {
                card.appendChild(el("h3", "bsq-title", STRINGS.title));
                card.appendChild(el("p", "bsq-subtitle", STRINGS.subtitle));
            }
            card.appendChild(el("p", "bsq-question", q.text));
            const list = div("bsq-options");
            q.options.forEach((opt, i) => {
                const btn = el("button", "bsq-option", opt.label);
                btn.type = "button";
                if (this.answers[this.step] === opt.points && this.selectedIndex(this.step) === i) {
                    btn.classList.add("bsq-selected");
                }
                btn.addEventListener("click", () => {
                    this.answers[this.step] = opt.points;
                    this.selected[this.step] = i;
                    this.step++;
                    this.render();
                });
                list.appendChild(btn);
            });
            card.appendChild(list);
            if (this.step > 0) {
                const back = el("button", "bsq-back", STRINGS.back);
                back.type = "button";
                back.addEventListener("click", () => {
                    this.step--;
                    this.render();
                });
                card.appendChild(back);
            }
        }
        else {
            const qualified = this.score() >= QUALIFY_THRESHOLD;
            card.appendChild(el("h3", "bsq-result-heading", qualified ? STRINGS.qualifiedHeading : STRINGS.notYetHeading));
            card.appendChild(el("p", "bsq-result-body", qualified ? STRINGS.qualifiedBody : STRINGS.notYetBody));
            const cta = el("a", "bsq-cta", qualified ? STRINGS.qualifiedCta : STRINGS.notYetCta);
            cta.href = qualified ? BOOKING_URL : STAGE1_URL;
            card.appendChild(cta);
            if (!qualified) {
                const alt = el("a", "bsq-alt-link", STRINGS.qualifiedCta);
                alt.href = BOOKING_URL;
                card.appendChild(alt);
            }
            card.appendChild(el("p", "bsq-disclaimer", STRINGS.disclaimer));
        }
        this.root.appendChild(card);
    }
    selectedIndex(step) {
        var _a;
        return (_a = this.selected[step]) !== null && _a !== void 0 ? _a : -1;
    }
    /** Progress = questions answered / total. 1 of 4 answered → 25%. */
    progressBar() {
        const pct = Math.round((Math.min(this.step, QUESTIONS.length) / QUESTIONS.length) * 100);
        const wrap = div("bsq-bar-wrap");
        const track = div("bsq-bar-track");
        const fill = div("bsq-bar-fill");
        fill.style.width = pct + "%";
        track.appendChild(fill);
        wrap.appendChild(track);
        wrap.appendChild(el("span", "bsq-bar-label", STRINGS.pctComplete(pct)));
        return wrap;
    }
}
function el(tag, cls, text) {
    const e = document.createElement(tag);
    e.className = cls;
    if (text !== undefined)
        e.textContent = text;
    return e;
}
function div(cls) {
    return el("div", cls);
}
document.addEventListener("DOMContentLoaded", () => new QualifyWidget("bs-qualify"));

</script>
</body>
</html>
