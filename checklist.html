<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="14 things every contractor must have before applying for a bond, business credit, or government capital. Free interactive checklist.">
<title>Free Contractor Credit Readiness Checklist — BridgeScale Advisors</title>
<style>
:root{--navy:#0f1e35;--gold:#c9a84c;--bg:#F7F6F2;--ink:#1a1a1a;--muted:#5a6273;--line:#e2ddd2}
html{color-scheme:light only}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.bsq-bar-wrap,.bsi-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bsi-bar-wrap{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.bsq-bar-track,.bsi-bar-track{flex:1;height:8px;background:#e9e5da;border-radius:99px;overflow:hidden}
.bsq-bar-fill,.bsi-bar-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .3s ease;width:0}
.bsq-bar-label,.bsi-bar-label{font-size:12px;font-weight:bold;color:var(--navy);min-width:96px;text-align:right}
.bs-wrap{max-width:720px;margin:0 auto;padding:32px 20px 64px}
.bs-brand{color:var(--navy);font-weight:bold;letter-spacing:.04em;font-size:14px;text-transform:uppercase}
.bs-tag{color:var(--gold);font-size:12px;margin-bottom:24px}
/* qualifier */
.bsq-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 2px 10px rgba(27,42,74,.06)}
.bsq-progress{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.bsq-title{margin:0 0 4px;color:var(--navy);font-size:22px}
.bsq-subtitle{margin:0 0 16px;color:var(--muted);font-size:14px}
.bsq-question{font-size:17px;font-weight:bold;color:var(--navy);margin:12px 0 16px}
.bsq-options{display:grid;gap:10px}
.bsq-option{display:block;width:100%;text-align:left;padding:14px 16px;font-size:15px;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s;font-family:inherit}
.bsq-option:hover{border-color:var(--gold);background:#fdfaf2}
.bsq-selected{border-color:var(--navy);background:#f0f3fa}
.bsq-back{margin-top:16px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;font-family:inherit}
.bsq-result-heading{color:var(--navy);font-size:22px;margin:0 0 8px}
.bsq-result-body{color:var(--ink);font-size:15px;line-height:1.55}
.bsq-cta{display:inline-block;margin-top:12px;background:var(--gold);color:#fff;padding:13px 26px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:15px}
.bsq-cta:hover{background:#a58527}
.bsq-alt-link{display:block;margin-top:12px;color:var(--navy);font-size:13px}
.bsq-disclaimer{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.5}
/* intake */
.bsi-title{color:var(--navy);font-size:26px;margin:0 0 6px}
.bsi-subtitle{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 24px}
.bsi-form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 2px 10px rgba(27,42,74,.06)}
.bsi-section{border:none;border-top:2px solid var(--line);margin:0 0 8px;padding:18px 0 6px}
.bsi-section:first-child{border-top:none;padding-top:0}
.bsi-legend{color:var(--gold);font-weight:bold;font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding:0 0 6px}
.bsi-intro{font-size:13px;color:var(--muted);margin:0 0 10px}
.bsi-field{margin-bottom:16px}
.bsi-label{display:block;font-size:14px;font-weight:bold;color:var(--navy);margin-bottom:6px}
.bsi-input{width:100%;padding:11px 12px;font-size:15px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;background:#fff;color:var(--ink)}
.bsi-input:focus{outline:none;border-color:var(--gold)}
.bsi-group{display:grid;gap:6px}
.bsi-choice{font-size:14px;display:flex;align-items:flex-start;gap:8px;line-height:1.45;font-weight:normal;color:var(--ink)}
.bsi-choice input{margin-top:2px;accent-color:#0f1e35}
.bsi-missing{background:#fdf3f3;border-left:3px solid #c0392b;padding-left:10px;border-radius:4px}
.bsi-status{font-size:13px;color:var(--muted);min-height:18px}
.bsi-error{color:#c0392b;font-weight:bold}
.bsi-submit{background:var(--gold);color:#fff;border:none;padding:14px 30px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
.bsi-submit:hover{background:#a58527}
.bsi-mailto{display:block;margin-top:12px;font-size:12px;color:var(--muted)}
.bsi-sent{color:var(--navy);font-size:17px;font-weight:bold}
.bsi-disclaimer{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.5}
/* checklist */
.bsc-title{color:var(--navy);font-size:24px;margin:0 0 8px}
.bsc-subtitle{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}
.bsc-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(27,42,74,.06)}
.bsc-section-title{color:var(--gold);font-weight:bold;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px}
.bsc-section-title:first-child{margin-top:0}
.bsc-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:#fff}
.bsc-item:hover{border-color:var(--gold)}
.bsc-item input{margin-top:3px;accent-color:#0f1e35;flex-shrink:0}
.bsc-item-main{font-size:14px;color:var(--ink);font-weight:bold}
.bsc-item-cost{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.bsc-result{margin-top:18px;padding:16px;background:var(--bg);border-radius:8px}
.bsc-tier{font-size:18px;font-weight:bold;color:var(--navy)}
.bsc-tier-body{font-size:14px;color:var(--ink);line-height:1.5;margin:6px 0 4px}
.bsc-capture{margin-top:20px;background:var(--navy);border-radius:12px;padding:24px;color:#fff}
.bsc-capture-heading{color:#fff;font-size:20px;margin:0 0 6px}
.bsc-capture-body{color:#cfd5e2;font-size:13px;line-height:1.5;margin:0 0 14px}
.bsc-capture .bsi-input{margin-bottom:10px}
.bsc-consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#cfd5e2;line-height:1.45;margin-bottom:10px}
.bsc-consent input{margin-top:2px;accent-color:#c9a84c}
.bsc-capture .bsi-status{color:#cfd5e2}
.bsc-capture .bsi-error{color:#ffb3b3}
.bsc-capture .bsi-sent{color:#fff}
@media(max-width:480px){.bsq-card,.bsi-form,.bsc-card,.bsc-capture{padding:18px}}
</style>
</head>
<body>
<div class="bs-wrap">
  <a href="index.html" style="text-decoration:none"><div class="bs-brand">BridgeScale Advisors</div></a>
  <div class="bs-tag">Bid Bigger. Bond Faster. Build Without Limits.</div>
  <div id="bs-checklist"></div>
</div>
<script>
"use strict";
/**
 * BridgeScale Advisors — Contractor Credit Readiness Checklist (interactive lead magnet)
 * Source content: Bridgescale_Contractor_Credit_Readiness_Checklist_v2.pdf (Drive).
 * Visitor checks items → live score + tier → email capture sends their gap
 * report (including unchecked items) to BridgeScale via FormSubmit.
 */
const SUBMIT_ENDPOINT = "https://formsubmit.co/josh@bridgescaleadvisors.com";
const BOOKING_URL = "contact.html";
const UI = {
    title: "The Contractor Credit & Government Readiness Checklist",
    subtitle: "14 things every contractor must have before applying for a bond, business credit, or government capital. Check where you stand today — every unchecked box is a gap that is actively costing you contracts, bonding, or capital access.",
    scoreLabel: (n, t) => `${n} of ${t} checked`,
    emailHeading: "Get your personalized gap report",
    emailBody: "Enter your name and email and I'll send you a breakdown of your unchecked items — what each gap is costing you and the order to close them in. No spam, no obligation.",
    namePh: "Your name",
    emailPh: "you@company.com",
    consent: "I agree that BridgeScale Advisors may contact me about my results.",
    send: "Send My Gap Report",
    sent: "Report on its way — check your inbox shortly. Want to move faster?",
    sentCta: "Book a Free 30-Minute Readiness Assessment",
    missing: "Please add your name, email, and consent.",
    bookCta: "Book a Free Readiness Assessment",
    disclaimer: "BridgeScale Advisors is a business advisory firm. No specific credit, funding, bonding, or contract outcome is guaranteed. Consumers may dispute inaccurate information directly with the credit bureaus at no cost.",
};
const SECTIONS = [
    {
        title: "A · Business entity foundation",
        items: [
            { text: "Your business is structured as an LLC or Corporation (not a sole proprietorship)", cost: "Sole prop ties all credit obligations to your personal SSN — no entity separation possible" },
            { text: "You have an active EIN from the IRS that exactly matches your legal business name", cost: "Name mismatches cause trade line reporting failures and vendor application declines" },
            { text: "Your business has a physical street address (not a PO Box or home address)", cost: "PO Box gets declined on bonding apps, vendor accounts, and most lender applications" },
            { text: "Your business has a dedicated phone number listed in 411 and Google", cost: "An unlookable phone number triggers fraud flags — vendors and underwriters check this" },
            { text: "You have a business bank account in your company name with your EIN on file", cost: "Personal account = no verifiable business banking history for lenders or bonding companies" },
        ],
    },
    {
        title: "B · Business credit profile",
        items: [
            { text: "You have registered your D-U-N-S number at dnb.com (free — takes 1–2 weeks)", cost: "Without a D-U-N-S, your Paydex score never activates — all vendor purchases disappear" },
            { text: "You have set up your Experian Business profile via the iUpdate portal", cost: "Equipment lenders and LOC underwriters pull Experian Biz — most contractors skip this" },
            { text: "You have set up your Equifax Business profile via the Equifax Business portal", cost: "Government bonding companies frequently pull Equifax Biz — it must exist before you apply" },
            { text: "You have at least 3 active vendor accounts reporting to D&B (Paydex is active)", cost: "Minimum 3 trade lines required before Paydex generates — one account is not enough" },
            { text: "Your Name, Address, and Phone (NAP) are identical across D-U-N-S, Experian, SAM.gov, your website, and all vendor applications", cost: "Any mismatch causes reporting gaps — trade lines fail to attach to your profile" },
        ],
    },
    {
        title: "C · Government contractor requirements",
        items: [
            { text: "Your SAM.gov registration is active with a valid CAGE code", cost: "SAM.gov is required for ALL federal contract bids — lapsed SAM invalidates active bids" },
            { text: "Your SAM.gov registration renews annually — you have a renewal reminder on your calendar", cost: "SAM auto-expires — contractors lose active contracts because they missed the renewal date" },
            { text: "You have been approved for a surety bond (or know exactly why you were declined)", cost: "Most federal contracts above $150K require Miller Act bonds — denial = lost contract" },
            { text: "Your personal FICO is 650 or above (most surety companies use this as a floor)", cost: "Personal credit is reviewed by bonding companies regardless of business credit strength" },
        ],
    },
];
const TIERS = [
    { min: 12, label: "Strong foundation", body: "Focus on expanding vendor tiers and bond capacity. You're closer to bigger contracts than most — a strategy call can map the fastest route." },
    { min: 8, label: "Building", body: "You have real progress, but the remaining gaps are exactly the ones that block bonds and capital. Close them in the right order and you're contract-ready." },
    { min: 4, label: "Early stage", body: "A structured 90-day plan closes most of these gaps. The order matters — some items unlock others." },
    { min: 0, label: "Start here", body: "Foundation work is the only path to bonds and business credit — and it's faster than most contractors expect when done in sequence." },
];
class ChecklistWidget {
    constructor(rootId) {
        this.checked = [];
        this.total = 0;
        const el = document.getElementById(rootId);
        if (!el)
            throw new Error(`#${rootId} not found`);
        this.root = el;
        this.total = SECTIONS.reduce((n, s) => n + s.items.length, 0);
        this.build();
    }
    build() {
        this.root.appendChild(mk("h1", "bsc-title", UI.title));
        this.root.appendChild(mk("p", "bsc-subtitle", UI.subtitle));
        const barWrap = mk("div", "bsi-bar-wrap");
        const track = mk("div", "bsi-bar-track");
        const fill = mk("div", "bsi-bar-fill");
        fill.id = "bsc-bar-fill";
        track.appendChild(fill);
        barWrap.appendChild(track);
        const label = mk("span", "bsi-bar-label", UI.scoreLabel(0, this.total));
        label.id = "bsc-bar-label";
        barWrap.appendChild(label);
        this.root.appendChild(barWrap);
        const card = mk("div", "bsc-card");
        let idx = 0;
        for (const s of SECTIONS) {
            card.appendChild(mk("div", "bsc-section-title", s.title));
            for (const item of s.items) {
                const i = idx++;
                this.checked[i] = false;
                const row = mk("label", "bsc-item");
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.addEventListener("change", () => {
                    this.checked[i] = cb.checked;
                    this.update();
                });
                const textWrap = mk("div", "bsc-item-text");
                textWrap.appendChild(mk("div", "bsc-item-main", item.text));
                textWrap.appendChild(mk("div", "bsc-item-cost", item.cost));
                row.appendChild(cb);
                row.appendChild(textWrap);
                card.appendChild(row);
            }
        }
        const result = mk("div", "bsc-result");
        result.id = "bsc-result";
        card.appendChild(result);
        this.root.appendChild(card);
        const capture = mk("div", "bsc-capture");
        capture.id = "bsc-capture";
        capture.appendChild(mk("h2", "bsc-capture-heading", UI.emailHeading));
        capture.appendChild(mk("p", "bsc-capture-body", UI.emailBody));
        const form = document.createElement("form");
        form.id = "bsc-form";
        const name = document.createElement("input");
        name.type = "text";
        name.placeholder = UI.namePh;
        name.className = "bsi-input";
        name.id = "bsc-name";
        const email = document.createElement("input");
        email.type = "email";
        email.placeholder = UI.emailPh;
        email.className = "bsi-input";
        email.id = "bsc-email";
        const consentRow = mk("label", "bsc-consent");
        const consent = document.createElement("input");
        consent.type = "checkbox";
        consent.id = "bsc-consent";
        consentRow.appendChild(consent);
        consentRow.appendChild(document.createTextNode(" " + UI.consent));
        const status = mk("p", "bsi-status", "");
        status.id = "bsc-status";
        const btn = mk("button", "bsi-submit", UI.send);
        btn.type = "submit";
        form.appendChild(name);
        form.appendChild(email);
        form.appendChild(consentRow);
        form.appendChild(status);
        form.appendChild(btn);
        form.addEventListener("submit", (e) => this.submit(e));
        capture.appendChild(form);
        this.root.appendChild(capture);
        this.root.appendChild(mk("p", "bsi-disclaimer", UI.disclaimer));
        this.update();
    }
    score() {
        return this.checked.filter(Boolean).length;
    }
    tier() {
        const s = this.score();
        return TIERS.find((t) => s >= t.min) || TIERS[TIERS.length - 1];
    }
    update() {
        const s = this.score();
        const pct = Math.round((s / this.total) * 100);
        const fill = document.getElementById("bsc-bar-fill");
        const label = document.getElementById("bsc-bar-label");
        if (fill)
            fill.style.width = pct + "%";
        if (label)
            label.textContent = UI.scoreLabel(s, this.total);
        const result = document.getElementById("bsc-result");
        if (result) {
            const t = this.tier();
            result.innerHTML = "";
            result.appendChild(mk("div", "bsc-tier", `${s} / ${this.total} — ${t.label}`));
            result.appendChild(mk("p", "bsc-tier-body", t.body));
            const book = mk("a", "bsq-cta", UI.bookCta);
            book.href = BOOKING_URL;
            result.appendChild(book);
        }
    }
    gaps() {
        const out = [];
        let idx = 0;
        for (const s of SECTIONS)
            for (const item of s.items) {
                if (!this.checked[idx])
                    out.push(`[${s.title}] ${item.text}`);
                idx++;
            }
        return out;
    }
    async submit(e) {
        e.preventDefault();
        const name = document.getElementById("bsc-name").value.trim();
        const email = document.getElementById("bsc-email").value.trim();
        const consent = document.getElementById("bsc-consent").checked;
        const status = document.getElementById("bsc-status");
        if (!name || !email || !consent) {
            if (status) {
                status.textContent = UI.missing;
                status.className = "bsi-status bsi-error";
            }
            return;
        }
        const payload = new FormData();
        payload.append("name", name);
        payload.append("email", email);
        payload.append("score", `${this.score()} / ${this.total} — ${this.tier().label}`);
        payload.append("gaps", this.gaps().join("\n") || "None — all 14 checked");
        payload.append("_subject", "Checklist Lead — " + name + " (" + this.score() + "/" + this.total + ")");
        payload.append("_captcha", "false");
        payload.append("_template", "table");
        try {
            const res = await fetch(SUBMIT_ENDPOINT, { method: "POST", body: payload, headers: { Accept: "application/json" } });
            if (!res.ok)
                throw new Error(String(res.status));
            const capture = document.getElementById("bsc-capture");
            if (capture) {
                capture.innerHTML = "";
                capture.appendChild(mk("p", "bsi-sent", UI.sent));
                const cta = mk("a", "bsq-cta", UI.sentCta);
                cta.href = BOOKING_URL;
                capture.appendChild(cta);
            }
        }
        catch {
            const gaps = encodeURIComponent(this.gaps().join("\n"));
            window.location.href = `mailto:josh@bridgescaleadvisors.com?subject=${encodeURIComponent("Checklist Gap Report — " + name)}&body=${encodeURIComponent("Name: " + name + "\nEmail: " + email + "\nScore: " + this.score() + "/" + this.total + "\n\nGaps:\n")}${gaps}`;
        }
    }
}
function mk(tag, cls, text) {
    const e = document.createElement(tag);
    e.className = cls;
    if (text !== undefined)
        e.textContent = text;
    return e;
}
document.addEventListener("DOMContentLoaded", () => new ChecklistWidget("bs-checklist"));

</script>
</body>
</html>
